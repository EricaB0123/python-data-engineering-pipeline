version: '3.8'

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sqlserver
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_PID=Developer
      - MSSQL_SA_PASSWORD_FILE=/run/secrets/sql_password
    secrets:
      - sql_password
    ports:
      - "1433:1433"

  pipeline:
    build: .
    container_name: pipeline
    depends_on:
      - sqlserver
    environment:
      SQL_SERVER_HOST: "sqlserver"
      SQL_SERVER_PORT: "1433"
      SQL_SERVER_USER: "sa"
      SQL_SERVER_DB: "TrafficDB"
      SQL_SERVER_PASSWORD_FILE: "/run/secrets/sql_password"
    secrets:
      - sql_password
    volumes:
      - .:/app

secrets:
  sql_password:
    file: ./secrets/sql_password.txt
